<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F5F9" />
    <script>
      // Warnai chrome peramban seluler sesuai tema tersimpan; default terang
      // (sama dengan defaultTheme="light"), lalu ikuti toggle tema pengguna.
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]');
        function syncThemeColor() {
          var dark = document.documentElement.classList.contains('dark');
          meta.setAttribute('content', dark ? '#0A1426' : '#F3F5F9');
          styled = true;
        }
        var stored = localStorage.getItem('theme');
        if (stored) {
          syncThemeColor();
        } else {
          meta.setAttribute('content', '#F3F5F9');
        }
        // next-themes mengganti kelas <html>; ikuti agar meta tetap sinkron.
        new MutationObserver(syncThemeColor).observe(document.documentElement, { attributeFilter: ['class'] });
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo-polsri.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>LearnEase | POLSRI</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
